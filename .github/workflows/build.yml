name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Imagem fixa: toolset estavel entre runs (/Brepro reprodutivel).
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Build proxy
        shell: powershell
        run: .\scripts\build_spider_proxy.ps1

      - name: Check exports
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $out = dumpbin /exports release\d3d12.dll | Out-String
          foreach ($n in @("D3D12CreateDevice", "D3D12GetInterface", "SpiderFixVersion")) {
            if ($out -notmatch $n) { throw "Export ausente: $n" }
          }
          Write-Output "Exports OK"

      - name: Run installer tests
        shell: powershell
        run: .\tests\test_install.ps1

      - name: Run smoke test
        shell: powershell
        run: .\tests\smoke_test.ps1

      - name: Run config test
        shell: powershell
        run: .\tests\config_test.ps1

      - name: Pack release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "spiderfix.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # Staging preserva o layout que install_fix.ps1 espera (<raiz>\release\d3d12.dll).
          $stage = "staging"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$stage\release", "$stage\scripts" | Out-Null
          Copy-Item "release\d3d12.dll" "$stage\release\"
          foreach ($s in @("install_fix.ps1", "uninstall_fix.ps1", "SpiderFixGUI.ps1", "SpiderFixCommon.ps1")) {
            if (!(Test-Path "scripts\$s")) { throw "Script ausente: scripts\$s" }
            Copy-Item "scripts\$s" "$stage\scripts\"
          }
          Copy-Item "LICENSE", "README.md", "README_EN.md", "spiderfix.ini.example" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          @(
            (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip"
            (Get-FileHash "release\d3d12.dll" -Algorithm SHA256).Hash.ToLower() + "  release/d3d12.dll"
          ) | Set-Content "SHA256SUMS.txt" -Encoding Ascii
          Get-Content SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spiderfix
          path: |
            spiderfix.zip
            SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Pushes seguidos da mesma tag: serializa, sem cancelar o run em andamento.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spiderfix

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: spiderfix.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Tag movida para um commit novo: atualiza os arquivos do release existente.
        # --clobber apaga o asset antes de reenviar: repete o upload para nao deixar o release sem zip.
        run: |
          upload() {
            for i in 1 2 3; do
              if gh release upload "$GITHUB_REF_NAME" spiderfix.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber; then return 0; fi
              echo "upload falhou (tentativa $i/3)"; sleep 10
            done
            return 1
          }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            upload
          else
            gh release create "$GITHUB_REF_NAME" spiderfix.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --generate-notes || upload
          fi
